<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneio de Ciclismo</title>
</head>
<body>
    <h1>Inscrições para o torneio de ciclismo 2026.1</h1>

    <form action="/resposta.html">

        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" placeholder="Insira seu nome completo"><br>
        <label for="dataNasc">Data de nascimento:</label><br>
        <input type="date" id="dataNasc" name="dataNasc">
    
        <br><br>

        <label for="modalidade">Modalidade: </label><br>
        <input type="radio" id="mountainBike" name="modalidade" value="Mountain Bike">
        <label for="mountainBike">Mountain Bike</label>
        <input type="radio" id="ciclismoDeEstrada" name="modalidade" value="Ciclismo de Estrada">
        <label for="ciclismoDeEstrada">Ciclismo de Estrada</label>
    
        <br><br>

        <label for="experiencia">Experiência com ciclismo:</label><br>
        <input type="radio" id="iniciante" name="experiencia" value="Iniciante">
        <label for="iniciante">Iniciante</label>
        <input type="radio" id="intermediario" name="experiencia" value="Intermediário">
        <label for="intermediario">Intermediário</label>
        <input type="radio" id="avancado" name="experiencia" value="Avançado">
        <label for="avancado">Avançado</label>
    
        <br><br>

        <label for="alimentacao">Alimentação:</label><br>
        <input type="checkbox" id="agua" name="alimentacao" value="agua">
        <label for="agua">Água</label><br>
        <input type="checkbox" id="lancheRapido" name="alimentacao" value="lanche rapido">
        <label for="lancheRapido">Lanche rápido</label><br>
        <input type="checkbox" id="lancheReforcado" name="alimentacao" value="lanche reforcado">
        <label for="lancheReforcado">Lanche reforçado</label><br>
        <input type="checkbox" id="cocaZero" name="alimentacao" value="coca-cola zero">
        <label for="cocaZero">Coca-cola Zero açúcar</label><br>
        <input type="checkbox" id="barraProteica" name="alimentacao" value="barra proteica">
        <label for="barraProteica">Barra de proteína</label><br>

        <br><br>

        <label for="aceite">Confirmo que li e aceito os termos e as condições do torneio</label><br>
        <input type="checkbox" id="sim" name="aceite" value="sim">
        <label for="aceite">Sim</label>

        <input type="submit" value="Enviar">
    
    </form>
</body>
</html>
