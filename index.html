<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{ 
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-wrap: wrap;
            border: 2px solid rgb(0, 0, 100);
            border-radius: 20px;
            margin: 10px;
            width: 215px;
            height: 300px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;

        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
            
        }
        .card h3 {
            margin: 10px 0 5px 0;
            text-align: center;
            font-size: 1.1rem;
        }

        img {

            width: 200px;
            height: 200px;
            border-radius: 20px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <script>
        async function promiseCharacters() {
            try {
                const response = await fetch('https://hp-api.onrender.com/api/characters/staff')
                if(!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`)
                }

                const characters = await response.json()
                console.log("Personagens: ", characters)
                return characters
            }
            
            catch(error) {
                console.error("Falha ao buscar personagens: ", error)
            }
        }


        async function createCharacters()  {
            const todosPersonagens = await promiseCharacters()

            todosPersonagens.map(personagem => {
                console.log("Primeiro personagem: ", todosPersonagens[0]);

                const divCardPersonagem=document.createElement("div")
                const imgPersonagem = document.createElement("img")
                const nomePersonagem = document.createElement("h3")
                const casaPersonagem = document.createElement("h3")


                divCardPersonagem.id = "container";
                divCardPersonagem.classList.add("card");

                personagem.image ? imgPersonagem.src = personagem.image : imgPersonagem.src = "imgDesconhecido.jpeg" 

                nomePersonagem.innerHTML = personagem.name
                casaPersonagem.innerHTML = personagem.house

                divCardPersonagem.appendChild(imgPersonagem)
                divCardPersonagem.appendChild(nomePersonagem)
                divCardPersonagem.appendChild(casaPersonagem)

                document.body.appendChild(divCardPersonagem)
            })
        }

        createCharacters()


    </script>
</body>
</html>
