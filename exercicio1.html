<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Agendamento de Consultoria</title>
</head>
<body>

  <h1>Agendamento de Consultoria</h1>

  <form>

    <label>Buscar serviço:</label><br>
    <input type="search" list="servicos" name="busca">
    <datalist id="servicos">
      <option value="Consultoria">
      <option value="Auditoria">
      <option value="Mentoria">
      <option value="Treinamento">
    </datalist><br><br>

    <label>E-mail:</label><br>
    <input type="email" name="email"><br><br>

    <label>Telefone:</label><br>
    <input type="tel" name="telefone"><br><br>

    <label>LinkedIn ou site pessoal:</label><br>
    <input type="url" name="url"><br><br>

    <label>Quantidade de horas de consultoria:</label><br>
    <input type="number" name="horas" min="1"><br><br>

    <label>Nível de urgência (1 a 10):</label><br>
    <input type="range" name="urgencia" min="1" max="10"><br><br>

    <label>Cor principal da identidade visual:</label><br>
    <input type="color" name="cor"><br><br>

    <label>Data da primeira reunião:</label><br>
    <input type="date" name="data"><br><br>

    <label>Mês de faturamento:</label><br>
    <input type="month" name="mes"><br><br>

    <label>Semana de início do projeto:</label><br>
    <input type="week" name="semana"><br><br>

    <label>Horário de início da chamada:</label><br>
    <input type="time" name="horario"><br><br>

    <label>Check-in de Emergência (data e hora):</label><br>
    <input type="datetime-local" name="checkin"><br><br>

    <button type="submit">Agendar</button>

  </form>

  <h2>Status do Consultor</h2>
  <label>Ocupação da agenda:</label><br>
  <meter value="0.7" min="0" max="1">70%</meter>

  <h2>Localização do Escritório</h2>

</body>
</html>
