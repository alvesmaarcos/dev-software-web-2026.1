<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: url(foto.jpg);
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            height: 80vh;
            justify-content: center;
            align-items: center;    
        }


        .container {
            display: flex;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .div1 { backdrop-filter: blur(); width: 300px; height: 50px; background-color: rgba(255, 0, 0, 0.9); }
        .div2 { backdrop-filter: blur(); width: 200px; height: 50px; background-color: rgba(255, 0, 0, 0.6); }
        .div3 { backdrop-filter: blur(); width: 150px; height: 50px; background-color: rgba(255, 0, 0, 0.3); }
        .div4 { backdrop-filter: blur(); width: 100px; height: 50px; background-color: rgba(255, 0, 0, 0.1); }

        .div1:hover { backdrop-filter: blur();background-color: rgba(255, 0, 0, 0.1); }
        .div2:hover { background-color: rgba(255, 0, 0, 0.4); }
        .div3:hover { background-color: rgba(255, 0, 0, 0.7); }
        .div4:hover { background-color: rgba(255, 0, 0, 0.9); }
    </style>
</head>
<body>
    <div class="container">
        <div class="div1">Divisão 1</div>
        <div class="div2">Divisão 2</div>
        <div class="div3">Divisão 3</div>
        <div class="div4">Divisão 4</div>
    </div>
</body>
</html>
